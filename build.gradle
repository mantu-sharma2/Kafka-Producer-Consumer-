plugins {
  id 'java'
  id 'application'
}

group = 'self.SD'
version = '0.0.1-SNAPSHOT'
description = 'Kafka'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test') {
  useJUnitPlatform()
}

application {
  mainClass = 'self.sd.kafka.KafkaApplication'
}
